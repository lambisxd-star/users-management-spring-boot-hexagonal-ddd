services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: crud_usuarios
      MYSQL_USER: users_app
      MYSQL_PASSWORD: local_users_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data-dev:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: users-management-api-dev:local
    environment:
      PORT: "8080"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: crud_usuarios
      DB_USERNAME: users_app
      DB_PASSWORD: local_users_password
      DB_SSL_MODE: DISABLED
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-12345}
    ports:
      - "8080:8080"
    volumes:
      # Montar el código fuente para hot-reloading (si lo soporta)
      - ./src:/workspace/src
      - ~/.m2:/root/.m2
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql-data-dev:
