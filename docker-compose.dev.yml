services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped

  api-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: users-management-api-dev:local
    environment:
      PORT: "8080"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-local_postgres_password}
      DB_SSL_MODE: ${DB_SSL_MODE:-disable}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-12345}
    ports:
      - "8080:8080"
    volumes:
      - ./src:/workspace/src
      - ~/.m2:/root/.m2
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data-dev:
